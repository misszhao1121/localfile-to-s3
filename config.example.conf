# rustfs-migrate 配置文件
# 格式: key = value，支持 # 注释，值可带引号

# ---------- 必填 ----------

# 源目录（本地 MinIO 桶对应的普通文件目录树，每个文件=一个对象）
source_root = /data/minio/dev-industai-app

# RustFS 的 S3 访问地址（推荐写负载均衡/VIP入口）
endpoint = http://rustfs-distributed-svc.middleware:9000

# 目标桶
bucket = dev-industai-app

# 访问凭证（不要把真实密钥提交到 git！推荐做法：
#   cp config.example.conf config.conf 后在 config.conf 里填真实值，
#   config.conf 已被 .gitignore 排除）
access_key = YOUR_ACCESS_KEY
secret_key = YOUR_SECRET_KEY

# ---------- 可选 ----------

# 区域（大多数 S3 兼容实现随意填 us-east-1 即可）
region = us-east-1

# 状态目录（SQLite 断点库、日志；必须放在源目录之外 —— 源目录严格只读，
# 若配置在 source_root 内程序会拒绝启动）
state_dir = /var/lib/rustfs-migrate

# 对象 key 前缀（默认空 = 与源相对路径一一对应；示例会把 key 变成 bk2026/xxx）
# prefix = bk2026

# 上传并发数（4000万小文件建议 64~256，按 RustFS 集群与源盘能力调整）
workers = 128

# verify 模式的 HEAD 并发数
verify_workers = 256

# 单文件内存缓冲（MiB）。所有待传文件按此缓冲读入后 PUT；
# 4000万小文件场景 4~8 MiB 足够
buffer_size_mib = 4

# 单个对象的最大重试次数（叠加 SDK 内部重试）
max_retries = 8

# 重试退避基数/上限（毫秒）
retry_base_ms = 250
retry_max_ms = 30000

# S3 响应超时（秒）
http_timeout_sec = 60

# 以下两项一般不用改
list_token_size = 1000

# 每次启动重新扫描源目录以纳入新增文件（默认 false：断点续传直接跳过扫描）
rescan_on_start = false

# 目标桶不存在时自动创建（生产建议提前手动建桶，此处留 false）
create_bucket = false

# 首次运行自动比对（默认 true）：每个待上传文件先 HEAD 一次 RustFS，
# 已存在且大小一致的对象直接标记完成跳过（零 PUT 流量）。
# 适合"之前已通过其他方式传过一部分"的场景，migrate 直接跑即可，
# 无需先手动 verify。
# 注意：比对依据是对象大小；HEAD 无法比对内容哈希。
# 设为 false 可关闭（纯净桶迁移可关掉省一次 HEAD）
dedup_head = true

# 日志文件（含每个失败 key 的完整错误信息；不填则只输出到控制台）
# 注意：日志也必须位于源目录之外
log_file = /var/lib/rustfs-migrate/run.log

# ---------- 源目录只读兜底 ----------
#
# 本工具对 source_root 只有两种操作：readdir 列目录、O_RDONLY 打开读。
# 代码中不存在对源目录的删除/改名/写入调用（见 sourcefs.go 的守卫）。
# 建议运维侧再加一层物理兜底（迁移窗口内）：
#   mount -o bind,ro /data/minio/dev-industai-app /data/minio/dev-industai-app
# 或: chmod -R a-w /data/minio/dev-industai-app   （迁移完成后再放开）
#
# 程序启动时会自动探测源目录是否拒绝写入；若可写会打印 WARNING 提醒。
